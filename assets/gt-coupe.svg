<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 440" role="img" aria-label="Illustrated performance coupe side profile">
 <defs>
  <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a5adb3"/><stop offset=".16" stop-color="#616e77"/><stop offset=".42" stop-color="#343f47"/><stop offset=".72" stop-color="#161d22"/><stop offset="1" stop-color="#05090c"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172a35"/><stop offset=".4" stop-color="#4d626b"/><stop offset=".65" stop-color="#17232b"/><stop offset="1" stop-color="#080f15"/></linearGradient>
  <linearGradient id="trim" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9daab0"/><stop offset=".3" stop-color="#d1d3d0"/><stop offset=".7" stop-color="#7b858d"/><stop offset="1" stop-color="#c8cbcc"/></linearGradient>
  <radialGradient id="tire"><stop offset="0" stop-color="#10161a"/><stop offset=".56" stop-color="#151b1f"/><stop offset=".84" stop-color="#060b0e"/><stop offset="1" stop-color="#333a40"/></radialGradient>
  <radialGradient id="rim"><stop stop-color="#a2aaa8"/><stop offset=".3" stop-color="#535e65"/><stop offset=".65" stop-color="#171f25"/><stop offset="1" stop-color="#879093"/></radialGradient>
  <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#edf1ed" stop-opacity="0"/><stop offset=".25" stop-color="#d7e1e1" stop-opacity=".85"/><stop offset=".65" stop-color="#737f84" stop-opacity=".38"/><stop offset="1" stop-color="#e9e9e6" stop-opacity="0"/></linearGradient>
  <filter id="shadow"><feGaussianBlur stdDeviation="21"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
 </defs>
 <style>
   .wheel-rotor { animation: wheel-turn 2.9s linear infinite; transform-box:view-box; }
   .wheel-rotor.rear { transform-origin:305px 286px; }
   .wheel-rotor.front { transform-origin:759px 286px; }
   @keyframes wheel-turn { to { transform:rotate(360deg); } }
   @media (prefers-reduced-motion: reduce) { .wheel-rotor {animation:none;} }
 </style>

 <ellipse cx="525" cy="345" rx="410" ry="26" fill="#000" opacity=".65" filter="url(#shadow)"/>
 <path d="M76 343H960" stroke="#f04b30" stroke-width="2" opacity=".6"/>
 <!-- Rear diffuser and frontal splitter -->
 <path d="M124 286L200 295L251 307L790 309L883 300L938 286L937 303L878 315L258 320L148 307Z" fill="#080e13"/>
 <path d="M819 296L955 293L976 298L951 309L813 308Z" fill="#1b252b"/>
 <!-- Wheels behind wheel arches -->
 <g>
   <circle cx="305" cy="286" r="81" fill="url(#tire)" stroke="#555f61" stroke-width="5"/>
   <circle cx="305" cy="286" r="65" fill="#11191d" stroke="#3d484e" stroke-width="3"/>
   <circle cx="305" cy="286" r="56" fill="url(#rim)" stroke="#808a8d" stroke-width="1.7"/>
   <g class="wheel-rotor rear">
   <g fill="#0d1519" stroke="#6d787d" stroke-width="1.2">
    <path d="M301 285L276 231L293 230L314 271Z"/><path d="M305 283L360 259L361 278L319 295Z"/><path d="M308 288L331 342L313 345L298 302Z"/><path d="M300 287L254 320L251 300L288 282Z"/><path d="M303 279L285 238L309 235L314 278Z"/>
   </g>
   <circle cx="305" cy="286" r="16" fill="#404b50" stroke="#adb6b6" stroke-width="3"/><circle cx="305" cy="286" r="6" fill="#ed5337"/>
   </g>
   <circle cx="759" cy="286" r="81" fill="url(#tire)" stroke="#555f61" stroke-width="5"/>
   <circle cx="759" cy="286" r="65" fill="#11191d" stroke="#3d484e" stroke-width="3"/>
   <circle cx="759" cy="286" r="56" fill="url(#rim)" stroke="#808a8d" stroke-width="1.7"/>
   <g class="wheel-rotor front">
   <g fill="#0d1519" stroke="#6d787d" stroke-width="1.2">
    <path d="M755 285L730 231L747 230L768 271Z"/><path d="M759 283L814 259L815 278L773 295Z"/><path d="M762 288L785 342L767 345L752 302Z"/><path d="M754 287L708 320L705 300L742 282Z"/><path d="M757 279L739 238L763 235L768 278Z"/>
   </g>
   <circle cx="759" cy="286" r="16" fill="#404b50" stroke="#adb6b6" stroke-width="3"/><circle cx="759" cy="286" r="6" fill="#ed5337"/>
   </g>
 </g>
 <!-- body lower flank and sculpted sill -->
